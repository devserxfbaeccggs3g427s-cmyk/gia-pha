# Security scanning pipeline (Task 16.7, Requirements 15.10 / 15.11 / 15.16).
#
# Gates enforced on every push/PR to main plus a weekly full sweep:
#   - SAST ................ CodeQL (Java backend + JS/TS frontend & gateway)
#   - Secret scanning ..... Gitleaks over full history
#   - SCA + IaC + config .. Trivy filesystem scan (lockfiles, Dockerfiles,
#                           docker-compose, GitHub workflows); fails the build
#                           on unresolved CRITICAL/HIGH findings (Req 15.11)
#   - SBOM + license ...... CycloneDX aggregate BOM from the Maven reactor,
#                           published as a build artifact for license review
#
# A finding may only be waived via .trivyignore / CodeQL dismissal with a
# recorded rationale (see docs/migration/ops/security-controls.md).
name: security-scans

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1" # weekly sweep, Monday 02:00 UTC

permissions:
  contents: read

jobs:
  codeql:
    name: SAST (CodeQL ${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "25"
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  secret-scan:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: leaked-then-deleted secrets still count
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-and-iac-scan:
    name: SCA + IaC (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (vulnerabilities, secrets, misconfigurations)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Req 15.11: unresolved critical/high findings block the merge.
          exit-code: "1"
          format: table

  sbom:
    name: SBOM + license inventory (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Generate aggregate SBOM for the backend reactor
        working-directory: backend
        run: mvn -B -DskipTests -Dspotless.check.skip=true org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
      - uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: backend/target/sbom.json
          if-no-files-found: error
          retention-days: 90
