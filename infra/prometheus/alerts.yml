# Prometheus alert rules for the microservice-decomposition research lane.
# Per Requirement 11.4 + design.md §Observability.

groups:
  - name: outbox
    rules:
      - alert: OutboxLagHigh
        expr: max by (service) (time() - outbox_oldest_unpublished_seconds) > 30
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Outbox lag > 30 s on {{ $labels.service }}"

  - name: saga
    rules:
      - alert: SagaStuck
        expr: saga_state{state="COMPENSATING"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Saga {{ $labels.saga }} stuck compensating"

  - name: services
    rules:
      - alert: ServiceDown
        expr: up{job="services"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.instance }} not responding"

  - name: reconciliation
    rules:
      - alert: ReconciliationDrift
        expr: reconciliation_drift_count / reconciliation_total_count > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Reconciliation drift > 1% on {{ $labels.service }}"
