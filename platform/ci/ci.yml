name: ci
on:
  pull_request: {}
  push: { branches: [main] }
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - name: Compile governance scanner
        run: javac -d tooling/architecture-scan/build $(find tooling/architecture-scan/src/main/java -name '*.java')
      - name: Run architecture scan
        run: java -cp tooling/architecture-scan/build com.familya.governance.scan.ArchitectureScan
      - name: No root reactor
        run: java -cp tooling/architecture-scan/build com.familya.governance.scan.NoRootReactorTest
      - name: No cross-service imports
        run: java -cp tooling/architecture-scan/build com.familya.governance.scan.CrossServiceImportTest
  changed-services:
    runs-on: ubuntu-latest
    needs: [architecture]
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(env.AFFECTED) }}
    env:
      AFFECTED: ${{ steps.affected.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - id: affected
        run: |
          chmod +x tooling/affected-services.sh
          echo "services=$(tooling/affected-services.sh)" >> "$GITHUB_OUTPUT"
      - if: matrix.service != ''
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - if: matrix.service != ''
        run: mvn -B -ntp -f ${{ matrix.service }}/pom.xml -Pci verify
