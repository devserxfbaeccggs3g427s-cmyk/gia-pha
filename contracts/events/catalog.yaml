## Forbidden payloads

- Raw Vercel Blob URLs / signed capabilities
- Plaintext passwords, BCrypt hashes, OAuth access/refresh tokens
- Non-allowlisted PII (e.g. government IDs, phone numbers, addresses)
  unless classified `MEDIUM` and approved by the privacy gate.
