# Event Catalog

The V2 event catalog. Every entry has a version, owning service, partition
key, retention class, and PII classification. Backward compatibility is
enforced by `platform/ci/schema-compat.sh`.

## Conventions

- Topic naming: `<context>.events.v<n>` for events, `<context>.commands.v<n>`
  for Saga commands, `<context>.replies.v<n>` for Saga replies.
- Partition key: `treeId` for tree-scoped contexts, `userId` for Identity.
- Headers: `eventId`, `correlationId`, `causationId`, `operationId`,
  `aggregateVersion`, `occurredAt`, `schemaVersion`, `traceparent`.
- Saga participants MUST publish replies on `<participant-context>.replies.v<n>`
  partitioned by `treeId`. Operation lifecycle events MUST be published by the
  Saga owner (not by Audit Ops) on `operations.events.v1`.

