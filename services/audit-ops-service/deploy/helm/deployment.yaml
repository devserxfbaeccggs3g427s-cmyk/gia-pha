apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-ops-service
  namespace: familya-audit-ops
  labels:
    app.kubernetes.io/name: audit-ops-service
    app.kubernetes.io/component: audit-ops
    app.kubernetes.io/part-of: family-tree
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: audit-ops-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit-ops-service
        app.kubernetes.io/component: audit-ops
        app.kubernetes.io/part-of: family-tree
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: audit-ops-workload
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: audit-ops-service
          image: ghcr.io/familya/audit-ops-service:REPLACE_WITH_SIGNED_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 9090
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: audit-ops-database
                  key: password
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: familya-example.kafka.example.com:9092
            - name: SPRING_KAFKA_SASL_JAAS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: audit-ops-kafka
                  key: jaas
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: audit-ops-service-config
            items:
              - key: application.yml
                path: application.yml
---
apiVersion: v1
kind: Service
metadata:
  name: audit-ops-service
  namespace: familya-audit-ops
  labels:
    app.kubernetes.io/name: audit-ops-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: audit-ops-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: grpc
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audit-ops-service
  namespace: familya-audit-ops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: audit-ops-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: familya-gateway
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: familya-kafka
      ports:
        - protocol: TCP
          port: 9092
    - to:
        - namespaceSelector:
            matchLabels:
              name: familya-mysql
      ports:
        - protocol: TCP
          port: 3306
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: audit-ops-service
  namespace: familya-audit-ops
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audit-ops-service
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: audit-ops-service
  namespace: familya-audit-ops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: audit-ops-service
  pollingInterval: 15
  cooldownPeriod: 120
  minReplicaCount: 2
  maxReplicaCount: 8
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: familya-example.kafka.example.com:9092
        consumerGroup: audit-ops-service
        topic: saga.replies.v1
        lagThreshold: "50"