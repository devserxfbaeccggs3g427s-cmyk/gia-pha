apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-ops-service-config
  namespace: familya-audit-ops
  labels:
    app.kubernetes.io/name: audit-ops-service
data:
  application.yml: |
    spring:
      application:
        name: audit-ops-service
      datasource:
        url: jdbc:mysql://familya-audit-ops.example.internal:3306/auditops?sslMode=VERIFY_CA
        username: audit-ops
        password: ${SPRING_DATASOURCE_PASSWORD}
        hikari:
          maximum-pool-size: 20
          minimum-idle: 5
      flyway:
        locations: classpath:db/migration
    familya:
      outbox:
        relay:
          enabled: true
          interval-ms: 500
      grpc:
        server:
          enabled: true
          port: 9090
      kafka:
        partitions: 12
        replication-factor: 3
      auditops:
        saga:
          max-attempts: 5
          retry-base-ms: 500
          retry-max-ms: 30000
        operator:
          admin-roles: AUDIT_OPERATOR,PLATFORM
    management:
      endpoint:
        health:
          probes:
            enabled: true
      health:
        livenessstate:
          enabled: true
        readinessstate:
          enabled: true
    logging:
      level:
        com.familya.auditops: INFO