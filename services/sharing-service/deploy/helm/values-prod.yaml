name: sharing-service
namespace: familya-sharing
replicaCount: 2
image:
  repository: ghcr.io/familya/sharing-service
  digest: REPLACE_WITH_SIGNED_DIGEST
  pullPolicy: IfNotPresent
env:
  - name: SPRING_PROFILES_ACTIVE
    value: prod
  - name: SPRING_DATASOURCE_URL
    value: jdbc:mysql://familya-sharing.example.internal:3306/sharing?sslMode=VERIFY_CA
  - name: SPRING_DATASOURCE_USERNAME
    value: sharing
  - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
    value: familya-example.kafka.example.com:9092
serviceAccount:
  name: sharing-workload
keda:
  enabled: true
  lagThreshold: "50"
