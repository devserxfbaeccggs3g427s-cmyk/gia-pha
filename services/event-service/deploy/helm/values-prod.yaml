name: event-service
namespace: familya-event
replicaCount: 2
image:
  repository: ghcr.io/familya/event-service
  digest: REPLACE_WITH_SIGNED_DIGEST
  pullPolicy: IfNotPresent
env:
  - name: SPRING_PROFILES_ACTIVE
    value: prod
  - name: SPRING_DATASOURCE_URL
    value: jdbc:mysql://familya-event.example.internal:3306/event?sslMode=VERIFY_CA
  - name: SPRING_DATASOURCE_USERNAME
    value: event
  - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
    value: familya-example.kafka.example.com:9092
serviceAccount:
  name: event-workload
keda:
  enabled: true
  lagThreshold: "50"
