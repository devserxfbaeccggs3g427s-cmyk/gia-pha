name: api-gateway
namespace: familya-api-gateway
replicaCount: 2
image:
  repository: ghcr.io/familya/api-gateway
  digest: REPLACE_WITH_SIGNED_DIGEST
  pullPolicy: IfNotPresent
env:
  - name: SPRING_PROFILES_ACTIVE
    value: prod
  - name: SPRING_DATASOURCE_URL
    value: jdbc:mysql://familya-api-gateway.example.internal:3306/gateway?sslMode=VERIFY_CA
  - name: SPRING_DATASOURCE_USERNAME
    value: api-gateway
  - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
    value: familya-example.kafka.example.com:9092
serviceAccount:
  name: api-gateway-workload
keda:
  enabled: true
  lagThreshold: "50"
