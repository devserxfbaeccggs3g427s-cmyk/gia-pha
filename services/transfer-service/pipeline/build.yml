name: transfer-service
on:
  push:    { paths: [services/transfer-service/**, platform/starters/**] }
  pull_request: { paths: [services/transfer-service/**, platform/starters/**] }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - run: mvn -B -ntp -f services/transfer-service/pom.xml -DskipTests package
      - run: mvn -B -ntp -f services/transfer-service/pom.xml -Dtest=ArchitectureTest test
      - run: mvn -B -ntp -f services/transfer-service/pom.xml jib:build
      - run: cosign sign --yes ghcr.io/familya/transfer-service:${{ github.sha }}
