name: identity-service
namespace: familya-identity
replicaCount: 2
image:
  repository: ghcr.io/familya/identity-service
  digest: REPLACE_WITH_SIGNED_DIGEST
  pullPolicy: IfNotPresent
resources:
  requests: { cpu: 500m, memory: 768Mi }
  limits:   { cpu: 2,    memory: 2Gi }
env:
  - name: SPRING_PROFILES_ACTIVE
    value: prod
  - name: SPRING_DATASOURCE_URL
    value: jdbc:mysql://familya-identity.example.internal:3306/identity?sslMode=VERIFY_CA
  - name: SPRING_DATASOURCE_USERNAME
    value: identity
  - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
    value: familya-example.kafka.example.com:9092
  - name: FAMILYA_OIDC_ISSUER
    value: https://auth.example.com
serviceAccount:
  name: identity-workload
keda:
  enabled: true
  lagThreshold: "50"
